name: Windows venv-holder live E2E

# TEMP (never merge): control-pipe identify flake repro loop.
on:
  push:
    branches:
      - 'wine2e/**'

permissions:
  contents: read

jobs:
  pipe-flake:
    name: control-pipe identify loop (windows)
    runs-on: blacksmith-32vcpu-windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Probe cold identify cost in a fresh server-like process
        shell: bash
        run: |
          set -uo pipefail
          for i in 1 2 3; do
            "$HERMES_PYTHON" -c "
          import time, sys
          sys.path.insert(0, '.')
          t = time.monotonic()
          import gateway.control_socket as cs
          t1 = time.monotonic()
          cs.build_identify_payload()
          t2 = time.monotonic()
          cs.build_identify_payload()
          t3 = time.monotonic()
          print(f'PROBE import={t1-t:.3f}s first_identify={t2-t1:.3f}s second_identify={t3-t2:.3f}s')
          "
          done

      - name: Loop the live control-pipe file under CPU load
        shell: bash
        run: |
          set -uo pipefail
          for i in $(seq 1 48); do "$HERMES_PYTHON" -c "while True: pass" & done
          for i in 1 2 3; do
            "$HERMES_PYTHON" -c "
          import time, sys
          sys.path.insert(0, '.')
          t = time.monotonic()
          import gateway.control_socket as cs
          t1 = time.monotonic()
          cs.build_identify_payload()
          t2 = time.monotonic()
          print(f'LOADED PROBE import={t1-t:.3f}s first_identify={t2-t1:.3f}s')
          "
          done
          pass=0; fail=0
          for i in $(seq 1 20); do
            if HERMES_TEST_FILE_RETRIES=0 bash scripts/run_tests.sh tests/gateway/test_control_socket_windows_live.py > "run-$i.log" 2>&1; then
              pass=$((pass+1)); echo "iteration $i: PASS"
            else
              fail=$((fail+1)); echo "iteration $i: FAIL"; grep -E "FAILED|deadline|Error" "run-$i.log" | head -8
            fi
          done
          echo "RESULT pass=$pass fail=$fail of 20"
          [ "$fail" -eq 0 ]
