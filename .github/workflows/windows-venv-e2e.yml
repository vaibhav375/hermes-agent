name: Windows venv-holder live E2E

# TEMPORARY wine2e probe workflow for two Windows flakes (never merged).
on:
  push:
    branches:
      - 'wine2e/**'

permissions:
  contents: read

concurrency:
  group: windows-venv-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  venv-holder-e2e:
    name: venv-holder live E2E (windows-latest)
    runs-on: blacksmith-32vcpu-windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Probe
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          HERMES_TEST_FILE_RETRIES=0 bash scripts/run_tests.sh tests/hermes_cli/test_zz_windows_flake_probe.py -- -m platforms -s -v

      - name: Control-socket live test x20 in parallel (no retries)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          files=()
          for i in $(seq -w 1 20); do
            cp tests/gateway/test_control_socket_windows_live.py tests/gateway/test_zz_cs_loop_$i.py
            files+=(tests/gateway/test_zz_cs_loop_$i.py)
          done
          HERMES_TEST_FILE_RETRIES=0 bash scripts/run_tests.sh -j 20 "${files[@]}" -- -m platforms -v --tb=short
          rc=$?
          rm -f tests/gateway/test_zz_cs_loop_*.py
          exit $rc

      - name: Backup staging recovery x20 in parallel (no retries)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          files=()
          for i in $(seq -w 1 20); do
            cp tests/hermes_cli/test_backup_staging_recovery.py tests/hermes_cli/test_zz_bk_loop_$i.py
            files+=(tests/hermes_cli/test_zz_bk_loop_$i.py)
          done
          HERMES_TEST_FILE_RETRIES=0 bash scripts/run_tests.sh -j 20 "${files[@]}" -- -m platforms -v --tb=short -k "killed_backup or retry_elsewhere"
          rc=$?
          rm -f tests/hermes_cli/test_zz_bk_loop_*.py
          exit $rc
